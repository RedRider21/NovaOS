plugins {
    id 'com.android.application'
}

android {
    namespace 'os.nova.launcher'
    compileSdk 34

    defaultConfig {
        applicationId "os.nova.launcher"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
