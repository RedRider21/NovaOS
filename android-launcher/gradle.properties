# Proprietà comuni del progetto Gradle (android-launcher/).
#
# NOTA: la build canonica dell'APK è android-launcher/build-apk.sh e NON passa da
# Gradle. Questo file serve alla via Gradle (Android Studio e modulo :gecko), che
# prima non esisteva affatto.

# GeckoView e la sua catena (androidx.core, lifecycle, media3…) sono dipendenze
# AndroidX: senza questo flag la build si ferma su :gecko:checkDebugAarMetadata.
android.useAndroidX=true

# R class per modulo: comportamento predefinito da AGP 8, dichiarato per chiarezza.
android.nonTransitiveRClass=true

org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
